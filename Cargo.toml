[package]
name = "edio"
version = "0.2.1"
authors = ["muleyuck <takuty.008.awenite.1121@gmail.com>"]
edition = "2021"
description = "A command-line tool that opens stdin in your editor and outputs the result to stdout"
repository = "https://github.com/muleyuck/edio"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
tempfile = "3.27.0"

[dev-dependencies]
serial_test = "3.4.0"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
